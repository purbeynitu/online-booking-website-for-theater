services:
  - type: web
    name: girija-cinema-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://purbeynitu.github.io,http://localhost:5173,http://localhost:4173
      - key: NEPALPAY_MERCHANT_ID
        value: NP-GIRIJA-JANAKPUR-01
      - key: NEPALPAY_MERCHANT_NAME
        value: Girija Cinema Hall Janakpur
      - key: NEPALPAY_PAN
        value: 302918271
      - key: ESEWA_PRODUCT_CODE
        value: EPAYTEST
      - key: ESEWA_SECRET_KEY
        value: 8gBm/:&EnhH.1/q
